<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VetFlowCare — Recuperação Completa</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#0d2240 0%,#1E3A6E 50%,#0d6060 100%);
  min-height:100vh;padding:20px}
.card{background:#fff;border-radius:20px;padding:24px;max-width:400px;
  margin:0 auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.logo{text-align:center;margin-bottom:18px}
.logo h1{font-size:22px;font-weight:900;color:#1E3A6E}
.logo h1 span{color:#2DC0AE}
.logo p{font-size:11px;letter-spacing:2px;color:#94A3B8}
h2{font-size:13px;font-weight:800;color:#1E293B;margin:14px 0 6px}
.stat{background:#F0FDFB;border:1.5px solid #A7F3D0;border-radius:10px;
  padding:12px 14px;margin-bottom:10px}
.stat-row{display:flex;justify-content:space-between;font-size:13px;
  padding:3px 0;border-bottom:1px solid #D1FAE5;color:#1E293B}
.stat-row:last-child{border:none}
.stat-row b{color:#1E3A6E}
.snap-item{display:flex;justify-content:space-between;align-items:center;
  padding:8px 0;border-bottom:1px solid #F1F5F9;font-size:13px}
.snap-item:last-child{border:none}
.snap-label{color:#1E293B}
.snap-key{font-size:10px;color:#94A3B8}
.btn{width:100%;padding:13px;border-radius:12px;border:none;cursor:pointer;
  font-size:14px;font-weight:800;margin-bottom:8px}
.btn-primary{background:linear-gradient(135deg,#2DC0AE,#1a9d8e);color:#fff}
.btn-secondary{background:#EFF6FF;color:#1D4ED8;border:1.5px solid #BFDBFE}
.btn-snap{background:#F0FDFB;color:#065F46;border:1.5px solid #A7F3D0;
  padding:6px 10px;border-radius:8px;font-size:11px;font-weight:700;
  cursor:pointer;white-space:nowrap}
.alert-red{background:#FEF2F2;border:1.5px solid #FCA5A5;border-radius:10px;
  padding:10px 12px;font-size:12px;color:#991B1B;margin-bottom:10px}
.alert-green{background:#F0FDF4;border:1.5px solid #86EFAC;border-radius:10px;
  padding:10px 12px;font-size:12px;color:#14532D;margin-bottom:10px}
.alert-yellow{background:#FFFBEB;border:1.5px solid #FCD34D;border-radius:10px;
  padding:10px 12px;font-size:12px;color:#78350F;margin-bottom:10px}
#status{text-align:center;font-size:13px;color:#2DC0AE;font-weight:700;
  min-height:18px;margin:8px 0}
.loading{text-align:center;padding:30px;color:#64748B}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>VetFlow<span>Care</span></h1>
    <p>RECUPERAÇÃO COMPLETA DE DADOS</p>
  </div>

  <div id="loading" class="loading">🔍 Lendo todos os dados salvos neste celular...</div>
  <div id="content" style="display:none"></div>
</div>

<script>
const IDB_NAME = 'vetflowcare';
const LS_KEY   = 'vetflowcare_v5';

function idbOpen(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open(IDB_NAME, 3);
    r.onsuccess = ()=>res(r.result);
    r.onerror   = ()=>rej(r.error);
    r.onupgradeneeded = ()=>{
      const db = r.result;
      ['docs','snap','mirror'].forEach(s=>{
        if(!db.objectStoreNames.contains(s)) db.createObjectStore(s);
      });
    };
  });
}

function idbGetAll(db, store){
  return new Promise((res,rej)=>{
    try{
      const t = db.transaction(store,'readonly');
      const s = t.objectStore(store);
      const keys = [], vals = [];
      s.openCursor().onsuccess = e=>{
        const c = e.target.result;
        if(c){ keys.push(c.key); vals.push(c.value); c.continue(); }
        else  res({keys,vals});
      };
      t.onerror = ()=>rej(t.error);
    }catch(e){ res({keys:[],vals:[]}); }
  });
}

function fmtKey(k){
  const s = String(k);
  if(s.startsWith('d:')) return '📅 Dia '   + s.slice(2).split('-').reverse().join('/');
  if(s.startsWith('w:')) return '🗓️ Semana ' + s.slice(2).replace('-W','/');
  if(s.startsWith('m:')){
    const [y,m] = s.slice(2).split('-');
    const meses = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    return '📆 '+(meses[parseInt(m)-1]||m)+'/'+y;
  }
  return '💾 '+s;
}

function baixarJSON(data, nome){
  const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
}

async function init(){
  let db;
  try{ db = await idbOpen(); }catch(e){ db = null; }

  // ── Lê localStorage ──
  let dbMain = null;
  try{
    const raw = localStorage.getItem(LS_KEY) || localStorage.getItem('vetflowcare_v4') || localStorage.getItem('vetflowcare');
    if(raw) dbMain = JSON.parse(raw);
  }catch(e){}

  // ── Lê snapshots ──
  let snaps = {keys:[],vals:[]};
  if(db) try{ snaps = await idbGetAll(db,'snap'); }catch(e){}

  // ── Lê mirror ──
  let mirror = null;
  if(db) try{
    const mAll = await idbGetAll(db,'mirror');
    const idx = mAll.keys.findIndex(k=>String(k)==='data');
    if(idx>=0) mirror = mAll.vals[idx];
    else if(mAll.vals.length>0) mirror = mAll.vals[0];
  }catch(e){}

  // ── Estatísticas do DB principal ──
  let pets=0, atend=0, vac=0, cobr=0, tuts=0, dataMin='', dataMax='';
  if(dbMain){
    tuts  = (dbMain.tutors||[]).length;
    pets  = (dbMain.pets||[]).length;
    cobr  = (dbMain.charges||[]).length;
    const datas = [];
    (dbMain.pets||[]).forEach(p=>{
      atend += (p.appointments||[]).length;
      vac   += (p.vaccines||[]).filter(v=>v.applied).length;
      (p.appointments||[]).forEach(a=>{ if(a.date) datas.push(a.date); });
      (p.vaccines||[]).forEach(v=>{ if(v.applied) datas.push(v.applied); });
    });
    datas.sort();
    if(datas.length){
      dataMin = datas[0].split('-').reverse().join('/');
      dataMax = datas[datas.length-1].split('-').reverse().join('/');
    }
  }

  // ── Renderiza ──
  const div = document.getElementById('content');
  let html = '';

  // Dados principais
  if(dbMain && pets > 0){
    html += `<div class="alert-green">✅ <b>Dados encontrados!</b> ${pets} paciente(s) neste celular.</div>`;
    html += `<h2>📊 Dados atuais</h2><div class="stat">
      <div class="stat-row"><span>👤 Tutores</span><b>${tuts}</b></div>
      <div class="stat-row"><span>🐾 Pacientes</span><b>${pets}</b></div>
      <div class="stat-row"><span>📅 Atendimentos</span><b>${atend}</b></div>
      <div class="stat-row"><span>💉 Vacinas aplicadas</span><b>${vac}</b></div>
      <div class="stat-row"><span>💰 Cobranças</span><b>${cobr}</b></div>
      ${dataMin ? `<div class="stat-row"><span>📆 Período</span><b>${dataMin} → ${dataMax}</b></div>`:''}
    </div>
    <button class="btn btn-primary" onclick="exportarPrincipal()">💾 Exportar dados atuais</button>`;
  } else if(dbMain){
    html += `<div class="alert-yellow">⚠️ Dados encontrados mas sem pacientes cadastrados.</div>
    <button class="btn btn-secondary" onclick="exportarPrincipal()">📥 Exportar mesmo assim</button>`;
  } else {
    html += `<div class="alert-red">❌ Nenhum dado encontrado no localStorage deste endereço.</div>`;
  }

  // Mirror
  if(mirror){
    html += `<h2>🪞 Cópia interna (espelho)</h2>
    <div class="stat"><div class="stat-row"><span>Status</span><b style="color:#2DC0AE">Disponível</b></div></div>
    <button class="btn btn-secondary" onclick="exportarMirror()">📥 Exportar cópia interna</button>`;
  }

  // Snapshots
  if(snaps.keys.length > 0){
    html += `<h2>📸 Pontos automáticos salvos (${snaps.keys.length})</h2>
    <div class="alert-green">✅ Encontramos <b>${snaps.keys.length} snapshots</b> — incluindo meses anteriores!</div>
    <div class="stat" style="padding:0 14px">`;
    snaps.keys.forEach((k,i)=>{
      html += `<div class="snap-item">
        <div><div class="snap-label">${fmtKey(k)}</div>
        <div class="snap-key">${String(k)}</div></div>
        <button class="btn-snap" onclick="exportarSnap(${i})">⬇️ Exportar</button>
      </div>`;
    });
    html += `</div>
    <button class="btn btn-primary" style="margin-top:10px" onclick="exportarTodos()">📦 Exportar TODOS os snapshots</button>`;
  } else {
    html += `<div class="alert-yellow" style="margin-top:10px">⚠️ Nenhum snapshot automático encontrado neste endereço.</div>`;
  }

  // Instruções
  html += `<div class="alert-yellow" style="margin-top:14px">
    <b>📋 Como usar os arquivos exportados:</b><br>
    Acesse <b>app.vetflowcare.com.br</b> → Ajustes → Restaurar Backup → selecione o arquivo → escolha <b>Mesclar</b> para unir com os dados atuais.
  </div>`;
  html += `<div id="status"></div>`;

  div.innerHTML = html;
  document.getElementById('loading').style.display='none';
  div.style.display='block';

  // ── Funções de exportação ──
  window._snaps = snaps;
  window._dbMain = dbMain;
  window._mirror = mirror;

  window.exportarPrincipal = ()=>{
    baixarJSON({_meta:{exportadoEm:new Date().toISOString(),origem:location.hostname,tipo:'principal'},...dbMain},
      `vetflowcare_principal_${new Date().toISOString().slice(0,10)}.json`);
    document.getElementById('status').textContent='✅ Arquivo exportado — verifique seus Downloads';
  };

  window.exportarMirror = ()=>{
    let data = mirror;
    try{ if(typeof mirror==='string') data = JSON.parse(mirror); }catch(e){}
    baixarJSON({_meta:{exportadoEm:new Date().toISOString(),origem:location.hostname,tipo:'mirror'},...(data||{mirror_raw:mirror})},
      `vetflowcare_mirror_${new Date().toISOString().slice(0,10)}.json`);
    document.getElementById('status').textContent='✅ Cópia interna exportada';
  };

  window.exportarSnap = (i)=>{
    const k = snaps.keys[i], v = snaps.vals[i];
    let data = v;
    try{ if(typeof v==='string') data = JSON.parse(v); }catch(e){}
    const nome = `vetflowcare_snap_${String(k).replace(/[^a-zA-Z0-9]/g,'_')}.json`;
    baixarJSON({_meta:{exportadoEm:new Date().toISOString(),origem:location.hostname,tipo:'snapshot',chave:String(k)},...(typeof data==='object'?data:{raw:v})}, nome);
    document.getElementById('status').textContent=`✅ Snapshot "${fmtKey(k)}" exportado`;
  };

  window.exportarTodos = async ()=>{
    document.getElementById('status').textContent='⏳ Exportando todos os snapshots...';
    for(let i=0;i<snaps.keys.length;i++){
      await new Promise(r=>setTimeout(r,300));
      window.exportarSnap(i);
    }
    setTimeout(()=>{ document.getElementById('status').textContent=`✅ ${snaps.keys.length} snapshots exportados!`; },500);
  };
}

window.addEventListener('load',()=>{ setTimeout(init,500); });
</script>
</body>
</html>
